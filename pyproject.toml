[project]
name = "airspace-live-tracker"
version = "0.1.0"
description = "Workspace root: installs every Python package for local development and CI."
requires-python = ">=3.12,<3.13"
dependencies = ["airspace-api", "airspace-common", "airspace-collector", "airspace-ingest"]

[dependency-groups]
dev = ["httpx>=0.28", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.uv.sources]
airspace-api = { workspace = true }
airspace-common = { workspace = true }
airspace-collector = { workspace = true }
airspace-ingest = { workspace = true }

[tool.uv.workspace]
members = ["collector", "libs/airspace_common", "services/api", "services/ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["airspace_common", "api", "collector", "ingest"]

[tool.pytest.ini_options]
testpaths = ["collector/tests", "libs/airspace_common/tests", "services/api/tests", "services/ingest/tests"]

[tool.mypy]
strict = true
files = ["libs"]
plugins = ["pydantic.mypy"]

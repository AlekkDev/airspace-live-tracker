[project]
name = "airspace-live-tracker"
version = "0.1.0"
description = "Workspace root: installs every Python package for local development and CI."
requires-python = ">=3.12,<3.13"
dependencies = ["airspace-common", "airspace-collector"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.uv.sources]
airspace-common = { workspace = true }
airspace-collector = { workspace = true }

[tool.uv.workspace]
members = ["collector", "libs/airspace_common"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["airspace_common", "collector"]

[tool.pytest.ini_options]
testpaths = ["collector/tests", "libs/airspace_common/tests"]

[tool.mypy]
strict = true
files = ["libs"]
plugins = ["pydantic.mypy"]

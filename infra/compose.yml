# Full server stack (docs/01-architecture.md). Services are added here as each milestone builds them.
# Secrets come from infra/.env (git-ignored); see .env.example.
name: airspace

services:
  db:
    # Exact tag: needs TimescaleDB >= 2.19 (timescale/timescaledb#7672). amd64 + arm64, includes PostGIS.
    image: timescale/timescaledb-ha:pg16.15-ts2.30.2
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      AIRSPACE_OWNER_PASSWORD: ${AIRSPACE_OWNER_PASSWORD:?}
      INGEST_WRITER_PASSWORD: ${INGEST_WRITER_PASSWORD:?}
      STREAM_WORKER_PASSWORD: ${STREAM_WORKER_PASSWORD:?}
      JOBS_PASSWORD: ${JOBS_PASSWORD:?}
      APP_READER_PASSWORD: ${APP_READER_PASSWORD:?}
      LLM_READONLY_PASSWORD: ${LLM_READONLY_PASSWORD:?}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?}
      DAGSTER_DB_PASSWORD: ${DAGSTER_DB_PASSWORD:?}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?}
      TS_TUNE_MEMORY: 4GB
      TS_TUNE_NUM_CPUS: "2"
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/home/postgres/pgdata
      - ./db/10-airspace.sh:/docker-entrypoint-initdb.d/10-airspace.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d airspace -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://airspace_owner:${AIRSPACE_OWNER_PASSWORD:?}@db:5432/airspace?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ../db:/db:ro
    command: up

  ingest-api:
    image: airspace-ingest:local
    build:
      context: ..
      dockerfile: services/ingest/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ingest_writer:${INGEST_WRITER_PASSWORD:?}@db:5432/airspace?sslmode=disable
    ports:
      # Local only. `tailscale serve` exposes it to the tailnet (docs/01-architecture.md).
      - "127.0.0.1:${INGEST_HOST_PORT:-8000}:8000"

  ingest-admin:
    image: airspace-ingest:local
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMIN_DATABASE_URL: postgres://airspace_owner:${AIRSPACE_OWNER_PASSWORD:?}@db:5432/airspace?sslmode=disable
    entrypoint: ["python", "-m", "ingest.admin"]

  # P4 orchestrator (docs/01-architecture.md#deployment). One image, three processes; instance
  # config in services/orchestrator/dagster_home. Runs execute inside dagster-code.
  dagster-code:
    image: airspace-orchestrator:local
    build: &dagster-build
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &dagster-env
      DAGSTER_DB_PASSWORD: ${DAGSTER_DB_PASSWORD:?}
    command: ["dagster", "code-server", "start", "-h", "0.0.0.0", "-p", "4000", "-m", "orchestrator.definitions", "--location-name", "airspace"]
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-p", "4000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  dagster-webserver:
    image: airspace-orchestrator:local
    build: *dagster-build
    restart: unless-stopped
    depends_on:
      dagster-code:
        condition: service_healthy
    environment: *dagster-env
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "workspace.yaml"]
    ports:
      # Local only. `tailscale serve` exposes it to the tailnet (docs/01-architecture.md).
      - "127.0.0.1:${DAGSTER_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:3000/server_info', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  dagster-daemon:
    image: airspace-orchestrator:local
    build: *dagster-build
    restart: unless-stopped
    depends_on:
      dagster-code:
        condition: service_healthy
    environment: *dagster-env
    command: ["dagster-daemon", "run", "-w", "workspace.yaml"]

volumes:
  db-data:

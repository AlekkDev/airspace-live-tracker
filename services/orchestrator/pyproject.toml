[project]
name = "airspace-orchestrator"
version = "0.1.0"
description = "P4 orchestrator: Dagster jobs and schedules (docs/04-pipelines.md#p4--orchestrated-jobs)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "airspace-common",
  "dagster==1.13.29",
  "dagster-postgres==0.29.29",
  "dagster-webserver==1.13.29",
  # The backup job queries the catalog directly (Dagster itself uses psycopg2).
  "psycopg[binary]>=3.2",
]

[tool.uv.sources]
airspace-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

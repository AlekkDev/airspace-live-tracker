[project]
name = "airspace-ingest"
version = "0.1.0"
description = "P2 ingest-api: validates, normalises and stores collector batches (docs/04-pipelines.md#p2--ingest)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "airspace-common",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "h3>=4.1",
  "psycopg[binary,pool]>=3.2",
  "uvicorn>=0.32",
]

[tool.uv.sources]
airspace-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

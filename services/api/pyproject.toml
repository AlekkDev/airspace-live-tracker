[project]
name = "airspace-api"
version = "0.1.0"
description = "public-api: read API and SSE stream (docs/05-api-contract.md)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "airspace-common",
  "fastapi>=0.115",
  "psycopg[binary,pool]>=3.2",
  "uvicorn>=0.32",
]

[tool.uv.sources]
airspace-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

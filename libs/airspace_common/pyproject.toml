[project]
name = "airspace-common"
version = "0.1.0"
description = "Shared code for every service: settings, logging, time helpers."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic-settings>=2.6", "structlog>=24.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airspace_common"]
